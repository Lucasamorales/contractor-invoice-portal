# R-TEST-05: ruff check, ruff format --check and pytest. No merge on red.
name: CI

on:
  push:
    # staging is where work lands; main is what production runs.
    branches: [main, staging]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      # R-TEST-02 runs against a throwaway Postgres. Never staging: the moment
      # real data is reachable from CI, CI is production (R-ENV-02).
      postgres:
        image: postgres:17
        env:
          # Trust auth: the container lives for one job on the runner's own
          # network and holds nothing, so there is no password to write down.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: portaltest
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PORTAL_TEST_DATABASE_URL: postgresql+psycopg://postgres@localhost:5433/portaltest

    steps:
      - uses: actions/checkout@v4

      - name: Install WeasyPrint's native libraries
        # R-PDF-13 and R-TEST-03 render a real PDF. Without these the tests
        # skip, and a regression in the invoice would reach Robin unnoticed.
        # fonts-crosextra-carlito is metric-compatible with Calibri, which the
        # template is set in.
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y             libpango-1.0-0 libpangoft2-1.0-0 libcairo2             libgdk-pixbuf-2.0-0 fonts-crosextra-carlito

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the pinned dependencies
        # --frozen fails rather than resolving: uv.lock is committed (R-SEC-12)
        # and CI must test what production will run.
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest

      - name: The PDF tests must not have been skipped
        # They skip themselves when WeasyPrint's native libraries are absent,
        # which is right on a developer's Windows machine and wrong here.
        # Silently not testing the invoice is the failure this job exists to
        # prevent, so a skip is turned into a red build.
        run: |
          uv run pytest tests/test_pdf_output.py -q --no-header > pdf-tests.log 2>&1
          cat pdf-tests.log
          if grep -q "skipped" pdf-tests.log; then
            echo "::error::The PDF tests skipped. WeasyPrint's libraries are missing."
            exit 1
          fi

      - name: Install Node for the browser-script tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Browser-script tests
        # app/static has no build step, so these run the shipped files as they
        # are, in jsdom. npm ci installs exactly what package-lock.json pins.
        run: |
          npm ci
          npm test

      - name: Build the Cloud Run image
        run: docker build -t contractor-invoice-portal:ci .
