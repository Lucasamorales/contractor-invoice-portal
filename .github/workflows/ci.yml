# R-TEST-05: ruff check, ruff format --check and pytest. No merge on red.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the pinned dependencies
        # --frozen fails rather than resolving: uv.lock is committed (R-SEC-12)
        # and CI must test what production will run.
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Tests
        # The integration suite needs a throwaway Postgres and is added with it.
        run: uv run pytest -m "not integration"
