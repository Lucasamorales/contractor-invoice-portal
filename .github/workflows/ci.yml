# R-TEST-05: ruff check, ruff format --check and pytest. No merge on red.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      # R-TEST-02 runs against a throwaway Postgres. Never staging: the moment
      # real data is reachable from CI, CI is production (R-ENV-02).
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: portaltest
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PORTAL_TEST_DATABASE_URL: postgresql+psycopg://postgres:test@localhost:5433/portaltest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the pinned dependencies
        # --frozen fails rather than resolving: uv.lock is committed (R-SEC-12)
        # and CI must test what production will run.
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest
