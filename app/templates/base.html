<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Invoices{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body{% if csrf_token %} hx-headers='{"X-CSRF-Token": "{{ csrf_token }}"}'{% endif %}>
  <header class="bar">
    <a class="brand" href="/">Invoices</a>
    <nav>
      <a href="/me">My details</a>
      {% if is_finance %}<a href="/admin">Admin</a>{% endif %}
    </nav>
  </header>

  {% if window_forced %}
    <p class="staging-banner">
      Staging: the submission window is forced open. In production this would
      be shut until the 24th.
    </p>
  {% endif %}

  <main>
    {% block steps %}{% endblock %}
    {% block content %}{% endblock %}
  </main>

  <footer class="foot">
    Something wrong? Tell Leo.
  </footer>
</body>
</html>
